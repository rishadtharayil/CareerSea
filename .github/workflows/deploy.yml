name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1035335423870/locations/global/workloadIdentityPools/careersea-pool/providers/github-provider'
          service_account: 'careersea-deployer@project-bbccc83a-4d06-4b06-b85.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend
        run: |
          cd backend
          gcloud run deploy career-sea-backend \
            --source . \
            --region us-central1 \
            --set-secrets="DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest,DB_PASSWORD=DB_PASSWORD:latest" \
            --set-env-vars "DB_NAME=postgres,DB_USER=postgres,DB_HOST=db.qhrmenvunfcykvmpyshb.supabase.co,DB_PORT=5432,DEBUG=False" \
            --clear-cloudsql-instances \
            --allow-unauthenticated \
            --quiet

      - name: Deploy Frontend
        run: |
          cd frontend
          gcloud run deploy career-sea-frontend \
            --source . \
            --region us-central1 \
            --port 8080 \
            --allow-unauthenticated \
            --quiet
